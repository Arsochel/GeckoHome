name: Deploy

on:
  push:
    branches: [main]

env:
  PROJECT_DIR: ${{ vars.PROJECT_DIR }}

jobs:
  # Пуш в main деплоится автоматически — без этого гейта сломанный код
  # уезжал бы в прод, не встретив ни одного теста (CI бегает только на ветках).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: System libraries for OpenCV / ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 ffmpeg
      - name: Install CPU torch
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install project + dev deps
        run: |
          pip install -r requirements.txt
          pip install -e ".[dev]"
          pip install ruff==0.15.17  # pinned: `format --check` must match local runs
      - name: Ruff
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Mypy
        run: mypy src/geckohome
      - name: Pytest
        run: pytest

  deploy:
    runs-on: self-hosted
    needs: test
    steps:
      - name: Pull latest code
        run: |
          $dir = "$env:PROJECT_DIR".Trim()
          $gitCmd = (where.exe git 2>$null | Select-Object -First 1)
          if (-not $gitCmd) { $gitCmd = "C:\Program Files\Git\cmd\git.exe" }
          & $gitCmd config --global --add safe.directory ($dir -replace '\\','/')
          Set-Location $dir
          & $gitCmd pull origin main

      - name: Deploy with Docker Compose
        timeout-minutes: 30
        # Docker Desktop на Windows-хосте; WSL Ubuntu на машине больше нет.
        # Явные проверки $LASTEXITCODE обязательны: PowerShell-степ возвращает
        # код ПОСЛЕДНЕЙ команды, и упавший build однажды прошёл незамеченным.
        # --force-recreate обязателен: код попадает в контейнер bind-mount'ом,
        # и без пересоздания процессы продолжают крутить старую версию.
        run: |
          $dir = "$env:PROJECT_DIR".Trim()
          Set-Location $dir
          # ASCII only in this script: the runner parses it as Windows-1251
          docker compose build
          if ($LASTEXITCODE -ne 0) {
            Write-Host "build failed, retrying once in 30s (transient network?)"
            Start-Sleep -Seconds 30
            docker compose build
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          docker compose up -d --force-recreate
          if ($LASTEXITCODE -ne 0) { exit 1 }
          docker compose ps
