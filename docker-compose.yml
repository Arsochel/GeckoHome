# json-file без лимита растёт бесконечно — ffmpeg/motion/tuya пишут постоянно
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  app:
    <<: *logging
    build: .
    # tini как PID 1 — реапит осиротевшие процессы (иначе форкнутые cloudflared
    # копились зомбями, т.к. в python:slim нет init)
    init: true
    command: geckohome-web
    ports:
      - "${SERVER_PORT:-8000}:8000"
    volumes:
      - .:/app
      - E:\GeckoTimelapse:/app/timelapse
    env_file: .env
    environment:
      MEDIAMTX_BIN: /usr/local/bin/mediamtx
      YOLO_MODEL_PATH: /app/models/gecko_yolo.pt
      TZ: Europe/Moscow
    restart: unless-stopped
    healthcheck:
      # curl в python:slim нет — проверяем стандартной библиотекой
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      autoheal: "true"

  bot:
    <<: *logging
    build: .
    init: true
    command: geckohome-bot
    volumes:
      - .:/app
      - E:\GeckoTimelapse:/app/timelapse
    env_file: .env
    environment:
      YOLO_MODEL_PATH: /app/models/gecko_yolo.pt
      TZ: Europe/Moscow
      APP_INTERNAL_URL: http://app:8000
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy

  # docker не перезапускает unhealthy-контейнеры сам — autoheal делает это
  # за него (следит за контейнерами с label autoheal=true)
  autoheal:
    <<: *logging
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
